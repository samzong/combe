name: Release

on:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate release tag and manifests
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            RELEASE_TAG="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          fi
          python3 scripts/release_version.py validate "$RELEASE_TAG"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
            test "$(git log -1 --format=%s)" = "chore(release): bump to $RELEASE_TAG"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          zig_version=$(sed -n 's/.*minimum_zig_version = "\([^"]*\)".*/\1/p' vendor/ghostty/build.zig.zon)
          curl -fsSL https://ziglang.org/download/index.json -o "$RUNNER_TEMP/zig-index.json"
          zig_url=$(jq -er --arg version "$zig_version" '.[$version]["aarch64-macos"].tarball' "$RUNNER_TEMP/zig-index.json")
          zig_sha=$(jq -er --arg version "$zig_version" '.[$version]["aarch64-macos"].shasum' "$RUNNER_TEMP/zig-index.json")
          curl -fsSL "$zig_url" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$zig_sha  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          xcodebuild -downloadComponent MetalToolchain
          rustup component add rustfmt clippy
          cargo install cargo-audit --locked

      - name: Check
        run: make check

      - name: Package
        run: |
          bash scripts/package_app.sh "${RELEASE_TAG#v}"
          codesign --verify --deep --strict build/Combe.app
          test "$(lipo -archs build/Combe.app/Contents/MacOS/Combe)" = arm64
          ditto -c -k --sequesterRsrc --keepParent build/Combe.app "build/Combe-${RELEASE_TAG}-macos-arm64.zip"

      - name: Generate release notes
        run: |
          set -euo pipefail
          cargo install git-cliff --version 2.14.1 --locked
          git-cliff --latest --strip header --output "$RUNNER_TEMP/generated-notes.md"
          grep -q '^\* ' "$RUNNER_TEMP/generated-notes.md"
          version="${RELEASE_TAG#v}"
          awk -v heading="## [$version]" '
            /^## / { if (found) exit; if (index($0, heading " ") == 1) found=1 }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '^\* ' "$RUNNER_TEMP/release-notes.md"

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "build/Combe-${RELEASE_TAG}-macos-arm64.zip" "${args[@]}"
