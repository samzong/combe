[workspace]
members = ["crates/combe", "crates/combe-catalog", "crates/ghostty-sys"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
combe-catalog = { path = "crates/combe-catalog" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
