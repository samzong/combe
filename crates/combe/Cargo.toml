[package]
name = "combe"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[package.metadata.release.pre-release-replacements]]
file = "../../packaging/Info.plist"
search = "<key>CFBundleShortVersionString</key>\n    <string>.*</string>"
replace = "<key>CFBundleShortVersionString</key>\n    <string>{{version}}</string>"
exactly = 1

[[package.metadata.release.pre-release-replacements]]
file = "../../packaging/Info.plist"
search = "<key>CFBundleVersion</key>\n    <string>.*</string>"
replace = "<key>CFBundleVersion</key>\n    <string>{{version}}</string>"
exactly = 1

[[bin]]
name = "combe"
path = "src/main.rs"

[dependencies]
block2 = "0.6"
combe-catalog = { path = "../combe-catalog" }
ghostty-sys = { path = "../ghostty-sys" }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-image = { version = "0.3", default-features = false, features = ["std", "CIContext", "CIImage", "objc2-core-foundation", "objc2-core-graphics", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "objc2-core-foundation"] }
objc2-foundation = "0.3"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CAAnimation", "CAMediaTiming", "CAMediaTimingFunction", "objc2-core-foundation"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
